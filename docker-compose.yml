services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-azurebuddy}
      MYSQL_USER: ${MYSQL_USER:-azurebuddy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-azurebuddy}
    ports:
      # Published to the host (not just the compose network) so `dotnet ef database update` can
      # reach it from outside the container - the API itself talks to "mysql" over the compose
      # network below, this port is only for running migrations from your machine. Defaults to 3307
      # (not 3306) since a machine already running MySQL locally would otherwise conflict with this
      # container on the standard port - override MYSQL_PORT in .env if 3307 is also taken.
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # "mysql" resolves via the compose network's built-in DNS - no host.docker.internal or fixed
      # IP needed, and it stays correct regardless of which host this is deployed to.
      ConnectionStrings__Default: "server=mysql;port=3306;database=${MYSQL_DATABASE:-azurebuddy};user=${MYSQL_USER:-azurebuddy};password=${MYSQL_PASSWORD:-azurebuddy}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env - see .env.example}
      Llm__Providers__0: Gemini
      Llm__Providers__1: Ollama
      Llm__Gemini__ApiKey: ${GEMINI_API_KEY:-}
    volumes:
      # Data Protection keys (encrypt stored ADO PATs) must survive container recreation - without a
      # named volume here, every `docker compose up --build` would generate fresh keys and every
      # previously-encrypted PAT would become permanently unreadable. See README's DataProtection note.
      - dp-keys:/app/DataProtection-Keys

volumes:
  mysql-data:
  dp-keys:
