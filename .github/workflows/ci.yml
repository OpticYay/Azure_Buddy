name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AzureBuddy.slnx is the new XML solution format, which needs an SDK new enough to parse it
      # even though every project inside still targets net8.0 - 10.0.x is what's used locally.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore AzureBuddy.slnx

      - name: Build
        run: dotnet build AzureBuddy.slnx --no-restore --configuration Release

      - name: Format check
        run: dotnet format AzureBuddy.slnx --verify-no-changes --no-restore

      # The test suite runs against a real MySQL database via Testcontainers (see
      # CustomWebApplicationFactory/SharedMySqlContainer), not EF Core's InMemory provider - InMemory
      # doesn't enforce MySQL's SQL dialect, constraints, or string-comparison behavior closely enough
      # for these to be genuine integration tests. Testcontainers needs Docker, which ubuntu-latest
      # GitHub-hosted runners already have preinstalled, so no extra service-container config is needed
      # here - the container is started by the test process itself on first use. IAdoClient is still
      # swapped for a fake, so no real Azure DevOps org or secrets are required either.
      - name: Test
        run: >
          dotnet test AzureBuddy.slnx --no-build --configuration Release
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage
          retention-days: 14

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
