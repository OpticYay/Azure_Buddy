    <!--
    Three faces, three jobs (see styles/tokens.css):
      Archivo   - display. Requested with its `wdth` (width) axis so headings can be set WIDE
                  (118%), which is where the industrial/instrument character comes from.
      Plex Sans - body copy.
      Plex Mono - IDs, timestamps, state tags. IBM drew Plex for engineering products, which is
                  the same world this tool lives in.
  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
