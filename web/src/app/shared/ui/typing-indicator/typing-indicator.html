<!-- Shaped like a log entry mid-write, so the wait reads as "Buddy is composing the next entry"
     rather than a generic loading state pasted into the thread. -->
<div class="pending" role="status" aria-label="Buddy is working">
  <div class="pending__meta">
    <span class="pending__role">Buddy</span>
    <span class="pending__hr" aria-hidden="true"></span>
  </div>
  <div class="pending__body">
    <span class="pending__caret" aria-hidden="true"></span>
    <span class="pending__label">Working</span>
  </div>
</div>
