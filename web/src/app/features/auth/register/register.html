<div class="auth">
  <img
    class="auth__logo"
    src="/assets/azurebuddy-logo.png"
    alt="Azure Buddy"
    width="480"
    height="261"
  />
  <form class="card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="card__head">
      <img class="mark" src="/assets/azurebuddy-mark.png" alt="" width="30" height="30" />
      <div>
        <h1>Create account</h1>
        <p class="tagline">You'll connect your Azure DevOps project after this</p>
      </div>
    </div>

    <label class="field">
      <span class="micro">Display name</span>
      <input type="text" formControlName="displayName" autocomplete="name" />
      @if (form.controls.displayName.touched && form.controls.displayName.invalid) {
        <span class="field__error">Enter a display name.</span>
      }
    </label>

    <label class="field">
      <span class="micro">Email</span>
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field__error">Enter a valid email address.</span>
      }
    </label>

    <label class="field">
      <span class="micro">Password</span>
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field__error">Use at least 8 characters, with a number and mixed case.</span>
      }
    </label>

    @if (errorMessage()) {
      <p class="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" class="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Creating account' : 'Create account' }}
    </button>

    <p class="switch">Already have an account? <a routerLink="/login">Sign in</a></p>
  </form>
</div>
