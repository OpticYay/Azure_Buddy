<div class="auth">
  <img class="auth__logo" src="/assets/azurebuddy-logo.png" alt="Azure Buddy" width="480" height="261" />

  @if (linkInvalid()) {
    <div class="card">
      <div class="card__head">
        <img class="mark" src="/assets/azurebuddy-mark.png" alt="" width="30" height="30" />
        <div>
          <h1>Invalid link</h1>
          <p class="tagline">This reset link is missing or malformed. Request a new one.</p>
        </div>
      </div>

      <p class="switch"><a routerLink="/forgot-password">Request a new reset link</a></p>
    </div>
  } @else {
    <form class="card" [formGroup]="form" (ngSubmit)="submit()">
      <div class="card__head">
        <img class="mark" src="/assets/azurebuddy-mark.png" alt="" width="30" height="30" />
        <div>
          <h1>Set a new password</h1>
          <p class="tagline">Choose a new password for your account</p>
        </div>
      </div>

      <label class="field">
        <span class="micro">New password</span>
        <input type="password" formControlName="newPassword" autocomplete="new-password" />
        @if (form.controls.newPassword.touched && form.controls.newPassword.invalid) {
          <span class="field__error">At least 8 characters.</span>
        }
      </label>

      @if (errorMessage()) {
        <p class="alert">{{ errorMessage() }}</p>
      }

      <button type="submit" class="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Resetting' : 'Reset password' }}
      </button>

      <p class="switch"><a routerLink="/login">Back to sign in</a></p>
    </form>
  }
</div>
