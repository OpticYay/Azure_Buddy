<div class="auth">
  <img
    class="auth__logo"
    src="/assets/azurebuddy-logo.png"
    alt="Azure Buddy"
    width="480"
    height="261"
  />

  @if (!submitted()) {
    <form class="card" [formGroup]="form" (ngSubmit)="submit()">
      <div class="card__head">
        <img class="mark" src="/assets/azurebuddy-mark.png" alt="" width="30" height="30" />
        <div>
          <h1>Reset your password</h1>
          <p class="tagline">We'll email you a link to set a new one</p>
        </div>
      </div>

      <label class="field">
        <span class="micro">Email</span>
        <input type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="field__error">Enter a valid email address.</span>
        }
      </label>

      <button type="submit" class="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Sending' : 'Send reset link' }}
      </button>

      <p class="switch"><a routerLink="/login">Back to sign in</a></p>
    </form>
  } @else {
    <div class="card">
      <div class="card__head">
        <img class="mark" src="/assets/azurebuddy-mark.png" alt="" width="30" height="30" />
        <div>
          <h1>Check your email</h1>
          <p class="tagline">If an account exists for that address, a reset link is on its way.</p>
        </div>
      </div>

      <p class="switch"><a routerLink="/login">Back to sign in</a></p>
    </div>
  }
</div>
