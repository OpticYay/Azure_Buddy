<div class="auth">
  <img
    class="auth__logo"
    src="/assets/azurebuddy-logo.png"
    alt="Azure Buddy"
    width="480"
    height="261"
  />
  <form class="card" [formGroup]="form" (ngSubmit)="submit()">
    <!--
      `[formGroup]="form"` (square brackets = property binding) connects this <form> to the
      FormGroup built in login.ts. `(ngSubmit)="submit()"` (parentheses = event binding) runs our
      method instead of the browser's default full-page form POST.
    -->
    <div class="card__head">
      <img class="mark" src="/assets/azurebuddy-mark.png" alt="" width="30" height="30" />
      <div>
        <h1>Azure Buddy</h1>
        <p class="tagline">File defects and pull work items without leaving the test</p>
      </div>
    </div>

    <label class="field">
      <span class="micro">Email</span>
      <input type="email" formControlName="email" autocomplete="email" />
      <!-- `@if` is Angular's built-in control flow. Errors only show once a field has been
           interacted with, so the form doesn't scold you before you've typed anything. -->
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field__error">Enter a valid email address.</span>
      }
    </label>

    <label class="field">
      <span class="micro">Password</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field__error">Enter your password.</span>
      }
    </label>

    <p class="switch"><a routerLink="/forgot-password">Forgot password?</a></p>

    @if (errorMessage()) {
      <p class="alert">{{ errorMessage() }}</p>
    }

    <!--
      `{{ }}` is interpolation - it drops a template expression's value into the rendered text.
      `isSubmitting()` calls the signal to read it; that call is what Angular tracks so it knows to
      re-render exactly this spot when the value changes.
    -->
    <button type="submit" class="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Signing in' : 'Sign in' }}
    </button>

    <p class="switch">No account yet? <a routerLink="/register">Create one</a></p>
  </form>
</div>
